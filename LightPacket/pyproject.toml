[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LightPacket"
version = "1.0.0"
description = "A flexible packet capture and processing library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MPL-2.0"}
authors = [{name = "Adam Boulaaz", email = "adamboulaaz92@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[tool.setuptools.package-data]
LightPacket = [
    "lib/*.so",
    "lib/*.dll",
    "lib/*.dylib",
    "data/*.json",
    "helper/protos/*.json",
]

# Optional extras
[project.optional-dependencies]
dev = [
    "pytest>=7"
]
